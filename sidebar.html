<!DOCTYPE html>
<html>
<head>
  <title>Qwen Sidebar</title>
  <link rel="stylesheet" type="text/css" href="sidebar.css">
</head>
<body>
  <iframe src="https://chat.qwen.ai/" id="qwen-iframe"></iframe>
  <script>
    window.addEventListener('message', event => {
      if (event.data.type === 'QWEN_WRITE_TEXT') {
        const qwenTextarea = document.getElementById('qwen-iframe').contentWindow.document.querySelector('textarea');
        if (qwenTextarea) {
          qwenTextarea.value = event.data.text;
          qwenTextarea.focus();
        }
      }
    });
  </script>
</body>
</html>
